name: Build iOS App (Simulator)

on:
  push:
    branches:
      - claude/backdoor-horror-game-axlfpg
    paths-ignore:
      - '**.md'
      - 'app/apk/**'
      - 'app/ios/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-ios-sim:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      # Unsigned build for the iOS Simulator - no Apple Developer account or
      # certificates needed, since the Simulator doesn't require code
      # signing. This is a "does it actually build" check anyone can run;
      # a real iPhone needs an Apple ID's own signing (see README).
      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app for download
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r App-simulator.zip App.app

      - uses: actions/upload-artifact@v4
        with:
          name: backdoor-ios-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App-simulator.zip
          if-no-files-found: error

      # Keep a single always-current copy committed in the repo itself, so
      # it can be grabbed directly instead of digging through Actions run
      # artifacts each time. App.app is a directory bundle, not a single
      # file, so the zip from the previous step stands in as "one file".
      - name: Commit built app into app/ios
        run: |
          mkdir -p app/ios
          cp ios/App/build/Build/Products/Debug-iphonesimulator/App-simulator.zip app/ios/backdoor-ios-simulator.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/ios/backdoor-ios-simulator.zip
          if git diff --cached --quiet; then
            echo "iOS build unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: update built app/ios/backdoor-ios-simulator.zip [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
