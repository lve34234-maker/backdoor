name: Build Android APK

on:
  push:
    branches:
      - claude/backdoor-horror-game-axlfpg
    paths-ignore:
      - '**.md'
      - 'app/apk/**'
      - 'app/ios/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: backdoor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keep a single always-current copy of the APK committed in the repo
      # itself, so it can be grabbed directly instead of digging through
      # Actions run artifacts each time.
      - name: Commit built APK into app/apk
        run: |
          mkdir -p app/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app/apk/backdoor.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/apk/backdoor.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: update built app/apk/backdoor.apk [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
